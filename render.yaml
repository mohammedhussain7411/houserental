services:
  # RentEasy Web Application with Real-Time Cross-Device Sync Server
  - type: web
    name: renteasy-app
    env: node
    plan: free
    buildCommand: cd renteasy/web && npm install && npm run build
    startCommand: cd renteasy/web && node server.cjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
